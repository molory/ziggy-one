name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start the server with …\n2. Open an agent …\n3. …"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: OS, Python (`python3 --version`), Claude Code (`claude --version`), browser, Ziggy One commit.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server output or browser console errors, if any. Remove tokens and private paths.
      render: text
