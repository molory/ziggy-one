# Pushing a tag vX.Y.Z publishes a GitHub release whose notes are that version's section of CHANGELOG.md.
# The tag must match a "## [X.Y.Z]" heading: move the "Unreleased" entries under it before tagging.
# The release carries the source archive and its signed build provenance (Sigstore bundle), which anyone can check:
#   gh attestation verify ziggy-one-vX.Y.Z.tar.gz --repo molory/ziggy-one
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Sigstore signing certificate for the provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
      - name: Source archive
        env:
          TAG: ${{ github.ref_name }}
        run: git archive --format=tar.gz --prefix="ziggy-one-$TAG/" -o "ziggy-one-$TAG.tar.gz" HEAD
      - name: Sign build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ziggy-one-${{ github.ref_name }}.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "ziggy-one-$TAG.tar.gz.sigstore.json"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Ziggy One $TAG" --notes-file notes.md --verify-tag \
            "ziggy-one-$TAG.tar.gz" "ziggy-one-$TAG.tar.gz.sigstore.json"
