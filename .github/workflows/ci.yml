name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # Development tools only, pinned by hash; Ziggy One itself still has no dependency.
      - name: Install linters
        run: "python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-lint.txt"
      - name: Python (ruff)
        run: ruff check --output-format github .
      - name: Workflows (zizmor)
        run: zizmor --offline --format github .github/workflows

  python:
    name: Server tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # macOS is supported too, and its terminals behave differently: oldest and newest Python.
        include:
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  fuzz:
    name: Fuzzing (atheris)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # Development tool only, pinned by hash; the unit tests run the same targets without it (tests/test_fuzz.py).
      - name: Install atheris
        run: "python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-fuzz.txt"
      - name: Damaged Kanban file
        run: python fuzz/fuzz_kanban.py -max_total_time=60
      - name: Paths of the Files tab
        run: python fuzz/fuzz_paths.py -max_total_time=60

  frontend:
    name: Front-end tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Syntax check
        run: for f in web/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test tests/*.test.mjs
