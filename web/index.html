<!doctype html>
<html lang="__LANG__" data-corners="__CORNERS__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ziggy One</title>
  <script src="/theme.js"></script>
  <meta name="csp-nonce" content="__CSP_NONCE__">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/vendor/xterm/xterm.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <p id="auth-error" class="banner" hidden>
    Unauthenticated session. Open the URL with <code>?token=…</code> printed in the terminal when the server starts.
  </p>

  <div class="layout">
    <aside class="sidebar">
      <!-- Sidebar header: logo, account and plan usage (refresh in place,
           or a click on the 5 h and 7 d gauges opens the details). -->
      <div class="sidebar-top">
        <h1 class="logo" title="Ziggy One"><span aria-hidden="true">Z</span><span class="visually-hidden">Ziggy One</span></h1>
        <div class="usage">
          <button id="usage" type="button" class="usage-open" aria-haspopup="dialog" aria-controls="account-dialog">
            <span id="avatar" class="avatar" aria-hidden="true">?</span>
            <span id="usage-windows" class="usage-windows"></span>
          </button>
          <button id="usage-refresh" type="button" class="usage-refresh" title="Refresh usage" aria-label="Refresh usage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg></button>
        </div>
        <!-- Collapse the sidebar into an avatar rail (Ctrl+B); collapsed and hovered, it opens over the content. -->
        <button id="sidebar-toggle" type="button" class="icon-button sidebar-toggle" aria-expanded="true" aria-keyshortcuts="Control+B">
          <svg class="icon-collapse" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M16 10l-2 2 2 2"/></svg>
          <svg class="icon-expand" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M14 10l2 2-2 2"/></svg>
        </button>
      </div>
      <section class="card sessions-card">
        <div class="card-head sessions-head">
          <!-- Mode: the agent list, or the Kanban boards (Tasks mode). -->
          <div class="segmented two mode-switch" role="radiogroup" aria-label="Mode">
            <label><input type="radio" name="mode" value="agents"><span>Agents</span></label>
            <label><input type="radio" name="mode" value="tasks"><span>Tasks</span></label>
          </div>
          <div class="head-controls agents-only">
            <div class="segmented two" role="radiogroup" aria-label="Filter agents">
              <label><input type="radio" name="session-filter" value="open"><span id="filter-open">Active</span></label>
              <label><input type="radio" name="session-filter" value="all"><span id="filter-all">All</span></label>
            </div>
            <!-- Pinned only: hides unpinned agents, in the list as in the workspaces. -->
            <button id="pinned-only" type="button" class="icon-button toggle-button" aria-pressed="false" title="Show pinned agents only" aria-label="Show pinned agents only"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5M9 10.8a2 2 0 0 1-1.1 1.8l-1.8.9A2 2 0 0 0 5 15.2V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.8a2 2 0 0 0-1.1-1.8l-1.8-.9A2 2 0 0 1 15 10.8V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg></button>
            <button id="new-conversation" type="button" class="icon-button" title="Create an agent or a workspace" aria-label="Create an agent or a workspace"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
            <button id="refresh-sessions" type="button" class="icon-button" title="Refresh" aria-label="Refresh agents"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg></button>
          </div>
          <div class="head-controls tasks-only">
            <button id="new-board" type="button" class="icon-button" title="Create a board or a workspace" aria-label="Create a board or a workspace"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          </div>
        </div>
        <!-- Search: through everything, even what the filters hide (Esc clears it). -->
        <div class="sidebar-search agents-only">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35"/></svg>
          <input id="agent-search" type="search" class="text-input" placeholder="Search agents…" aria-label="Search agents and workspaces" autocomplete="off" spellcheck="false">
        </div>
        <div class="sidebar-search tasks-only">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35"/></svg>
          <input id="board-search" type="search" class="text-input" placeholder="Search boards and tickets…" aria-label="Search boards and tickets" autocomplete="off" spellcheck="false">
        </div>
        <ul id="session-list" class="sessions agents-only"></ul>
        <ul id="board-list" class="sessions tasks-only" aria-label="Boards"></ul>
      </section>
      <!-- Collapsed sidebar: the plan usage, in a column, stuck to the bottom of the rail. -->
      <button id="rail-usage" type="button" class="rail-usage" aria-haspopup="dialog" aria-controls="account-dialog"></button>
    </aside>

    <div id="sidebar-resizer" class="resizer" role="separator" tabindex="0" aria-orientation="vertical"
         aria-label="Resize the sidebar" title="Drag to resize · double-click to reset"></div>

    <main class="main">
      <!-- Server restart: waiting for the agents, in progress, then confirmed (version, terminals reopened). -->
      <div id="server-banner" class="server-banner" role="status" aria-live="polite" hidden></div>
      <section id="chat" class="card chat">
        <div class="card-head">
          <div class="chat-heading">
            <span id="chat-avatar" class="agent-avatar header-avatar" aria-hidden="true" hidden></span>
            <h2 id="chat-title" class="chat-title">Conversation</h2>
          </div>
          <div class="actions">
            <button id="chat-close" type="button" class="icon-button" title="Close the agent" aria-label="Close the agent">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
        </div>
        <!-- Tabs: Claude Code in a terminal, its formatted discussion, Git if the agent's folder is in a repository, and its files. -->
        <div id="chat-tabs" class="chat-tabs" role="tablist" aria-label="Agent view" hidden>
          <button id="tab-terminal" type="button" role="tab" aria-selected="true" aria-controls="terminal-view">Terminal</button>
          <button id="tab-discussion" type="button" role="tab" aria-selected="false" aria-controls="discussion-view">Discussion</button>
          <button id="tab-git" type="button" role="tab" aria-selected="false" aria-controls="git-view">Git</button>
          <button id="tab-files" type="button" role="tab" aria-selected="false" aria-controls="files-view">Files</button>
          <button id="tab-shortcuts" type="button" role="tab" aria-selected="false" aria-controls="shortcuts-view">Shortcuts</button>
          <button id="tab-config" type="button" role="tab" aria-selected="false" aria-controls="config-view">Configuration</button>
        </div>
        <div id="git-view" class="chat-view git-view" role="tabpanel" aria-labelledby="tab-git" hidden></div>
        <div id="files-view" class="chat-view files-view" role="tabpanel" aria-labelledby="tab-files" hidden></div>
        <!-- Agent configuration: name, avatar, workspace, Claude settings, information, deletion. -->
        <div id="config-view" class="chat-view config-view" role="tabpanel" aria-labelledby="tab-config" hidden></div>
        <!-- Shortcuts: the agent's ready-made prompts (and its workspace's), sent to the Terminal with Ctrl+Shift+digit. -->
        <div id="shortcuts-view" class="chat-view shortcuts-view" role="tabpanel" aria-labelledby="tab-shortcuts" hidden></div>
        <div id="terminal-view" class="chat-view terminal-view" role="tabpanel" aria-labelledby="tab-terminal"></div>
        <!-- Discussion: the agent's conversation, formatted, read-only (you type in the Terminal). -->
        <div id="discussion-view" class="chat-view discussion-view" role="tabpanel" aria-labelledby="tab-discussion" hidden></div>
      </section>
      <!-- Tasks mode: the chosen Kanban board, or its creation, or its settings. -->
      <section id="board-card" class="card chat board-card tasks-only" aria-labelledby="board-title">
        <div class="card-head">
          <h2 id="board-title" class="chat-title">Tasks</h2>
          <div class="actions">
            <button id="board-settings" type="button" class="icon-button" title="Configure the board" aria-label="Configure the board" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2zM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg>
            </button>
            <button id="board-close" type="button" class="icon-button" title="Close" aria-label="Close" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
        </div>
        <div id="board-body" class="panel-body board-body"></div>
      </section>
      <!-- Creation and management area (agent, workspace): replaces the discussion during the action. -->
      <section id="panel" class="card chat panel" hidden aria-labelledby="panel-title">
        <div class="card-head">
          <h2 id="panel-title"></h2>
          <div class="actions">
            <button id="panel-close" type="button" class="icon-button" title="Close" aria-label="Close">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
        </div>
        <div id="panel-body" class="panel-body"></div>
      </section>
    </main>
  </div>

  <!-- Account, plan usage and preferences (like /usage in Claude Code). -->
  <dialog id="account-dialog" class="modal account-dialog" aria-labelledby="account-email">
    <div class="account-head">
      <span id="account-avatar" class="avatar big-avatar" aria-hidden="true">?</span>
      <div class="account-who">
        <h2 id="account-email">—</h2>
        <p id="account-sub" class="muted small"></p>
      </div>
      <button id="account-close" type="button" class="icon-button" title="Close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <!-- Configuration: a screen in the center (open Claude Code terminals…), first so it is easy to reach. -->
    <div class="account-settings">
      <button id="open-settings" type="button" class="settings-button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2zM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg>
        <span>Configuration</span>
        <span class="muted small">open Claude terminals</span>
      </button>
    </div>
    <section class="account-section" aria-labelledby="usage-heading">
      <div class="account-section-head">
        <h3 id="usage-heading">Plan usage</h3>
        <span id="usage-updated" class="muted small"></span>
        <button id="refresh-usage" type="button" class="icon-button" title="Refresh usage" aria-label="Refresh usage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg></button>
      </div>
      <div id="usage-bars" class="usage-bars"></div>
      <dl id="usage-facts" class="account-details"></dl>
    </section>
    <section class="account-section" aria-labelledby="ziggy-heading">
      <h3 id="ziggy-heading">Ziggy One</h3>
      <dl id="ziggy-facts" class="account-details"></dl>
    </section>
    <section class="account-section" aria-labelledby="prefs-heading">
      <h3 id="prefs-heading">Preferences</h3>
      <div class="prefs-row">
        <span class="muted small">Theme</span>
        <div class="segmented" role="radiogroup" aria-label="Theme">
          <label><input type="radio" name="theme" value="system"><span>System</span></label>
          <label><input type="radio" name="theme" value="light"><span>Light</span></label>
          <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
        </div>
      </div>
      <label class="toggle">
        <input id="notify-toggle" type="checkbox">
        <span>Notify me when an agent finishes or asks for permission</span>
      </label>
      <p id="notify-hint" class="muted small notify-hint" hidden></p>
    </section>
  </dialog>

  <dialog id="modal" class="modal" aria-labelledby="modal-title" aria-describedby="modal-message">
    <form method="dialog" class="modal-body">
      <h2 id="modal-title"></h2>
      <p id="modal-message"></p>
      <div id="modal-extra" class="modal-extra" hidden></div>
      <div class="modal-actions">
        <button id="modal-cancel" type="submit" value="cancel">Cancel</button>
        <button id="modal-confirm" type="submit" value="confirm" class="primary">Confirm</button>
      </div>
    </form>
  </dialog>
  <!-- Transient error (action refused, network…), at the bottom of the screen. -->
  <div id="toast" class="toast" role="alert" hidden></div>
</body>
</html>
